name: Fix preview cache and regeneration paging

on:
  push:
    paths:
      - '.github/workflows/fix-preview-cache-and-pagination.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch customer preview cache busting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/page.js')
          text = p.read_text()
          old = "preview_url: supabase.storage.from('fm-previews').getPublicUrl(row.preview_path).data.publicUrl,"
          new = "preview_url: `${supabase.storage.from('fm-previews').getPublicUrl(row.preview_path).data.publicUrl}?v=${Date.now()}` ,"
          if old not in text:
              raise SystemExit('customer preview URL line not found')
          p.write_text(text.replace(old, new, 1))

      - name: Patch admin library cache busting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/api/admin/library/route.js')
          text = p.read_text()
          old = "preview_url: photo.preview_path\n        ? supabase.storage.from('fm-previews').getPublicUrl(photo.preview_path).data.publicUrl\n        : null,"
          new = "preview_url: photo.preview_path\n        ? `${supabase.storage.from('fm-previews').getPublicUrl(photo.preview_path).data.publicUrl}?v=${Date.now()}`\n        : null,"
          if old not in text:
              raise SystemExit('admin preview URL block not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Patch regeneration pagination
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/api/admin/regenerate-previews/route.js')
          text = p.read_text()
          text = text.replace("    const limit = Math.min(100, Math.max(1, Number(body.limit) || 25));\n", "    const limit = Math.min(50, Math.max(1, Number(body.limit) || 10));\n    const offset = Math.max(0, Number(body.offset) || 0);\n")
          old = ".limit(limit);"
          new = ".range(offset, offset + limit - 1);"
          if old not in text:
              raise SystemExit('regeneration limit clause not found')
          text = text.replace(old, new, 1)
          old_tail = "    const { count: totalReady } = await supabase.from('fm_photos').select('id', { count: 'exact', head: true }).eq('event_id', event.id).eq('processing_status', 'ready');\n    const { count: remainingBefore } = await supabase.from('fm_photos').select('id', { count: 'exact', head: true }).eq('event_id', event.id).eq('processing_status', 'ready');\n\n    return NextResponse.json({\n      ok: true,\n      eventSlug,\n      requested: limit,\n      processed,\n      errors,\n      totalReady: totalReady || 0,\n      note: 'Call this endpoint repeatedly to rewrite the existing public previews. Existing AI indexes are unaffected because Rekognition now indexes private originals.',\n      remaining: Math.max(0, Number((totalReady || 0) - processed)),\n      remainingBefore,\n    });"
          new_tail = "    const { count: totalReady } = await supabase.from('fm_photos').select('id', { count: 'exact', head: true }).eq('event_id', event.id).eq('processing_status', 'ready');\n    const total = Number(totalReady || 0);\n    const nextOffset = Math.min(total, offset + processed);\n\n    return NextResponse.json({\n      ok: true,\n      eventSlug,\n      requested: limit,\n      offset,\n      processed,\n      errors,\n      totalReady: total,\n      nextOffset,\n      done: nextOffset >= total,\n      note: 'Existing previews are rewritten from private originals. Existing AI indexes are unaffected.',\n      remaining: Math.max(0, total - nextOffset),\n    });"
          if old_tail not in text:
              raise SystemExit('regeneration response block not found')
          p.write_text(text.replace(old_tail, new_tail, 1))
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.js app/api/admin/library/route.js app/api/admin/regenerate-previews/route.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: bust preview cache and paginate regeneration'
          git push
