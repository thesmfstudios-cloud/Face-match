name: Update photo preview pricing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch pricing and preview behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page = Path('app/page.js')
          s = page.read_text()

          changes = [
            ("price: 10, preview_url", "price: 5, preview_url"),
            ("price: 30, preview_url", "price: 20, preview_url"),
            ("price: Math.max(Number(photo.people_count || 1), faces.length) > 1 ? 30 : 10", "price: Math.max(Number(photo.people_count || 1), faces.length) > 1 ? 20 : 5"),
            ("₹10 single photo · ₹30 group photo · originals unlock after approval.", "₹5 single photo · ₹20 group photo · free preview download · originals unlock after approval."),
            ("Customers only receive a downscaled preview, never the original.", "Customers receive a clear, downscaled preview that can be downloaded for free; the full-resolution original stays private."),
            ("<div className=\"blurLayer\"/><div className=\"watermark\">SMF STUDIO</div>", ""),
            ("<b>₹{p.price || 10}</b>", "<b>₹{p.price || (Number(p.people_count || 1) > 1 ? 20 : 5)}</b>"),
            ("<div><b>Single photo</b><span>₹10</span></div><div><b>Group photo</b><span>₹30</span></div>", "<div><b>Single photo</b><span>₹5</span></div><div><b>Group photo</b><span>₹20</span></div>"),
            ("<div className=\"pricingNote\"><ShieldCheck size={18}/> Full-resolution originals remain private.</div>", "<div className=\"pricingNote\"><ShieldCheck size={18}/> Free preview download · Full-resolution originals remain private until payment approval.</div>"),
            ("<div className=\"previewLock\"><Lock size={13}/> PREVIEW</div>", "<a className=\"previewLock\" href={p.preview_url} download={p.original_filename || 'smf-preview.jpg'} target=\"_blank\" rel=\"noreferrer\" onClick={(e) => e.stopPropagation()}>DOWNLOAD FREE PREVIEW</a>"),
          ]
          for old, new in changes:
              if old in s:
                  s = s.replace(old, new)

          old_wrap = '<button key={p.id} className={`photoCard ${selected.includes(p.id) ? \'chosen\' : \'\'}`} onClick={() => toggle(p.id)}>'
          new_wrap = '<div key={p.id} className={`photoCard ${selected.includes(p.id) ? \'chosen\' : \'\'}`} role="button" tabIndex={0} onClick={() => toggle(p.id)} onKeyDown={(e) => { if (e.key === \'Enter\' || e.key === \' \') { e.preventDefault(); toggle(p.id); } }}>'
          if old_wrap in s:
              s = s.replace(old_wrap, new_wrap, 1)
              s = s.replace('</button>)}</div><div className="pricingRow">', '</div>)}</div><div className="pricingRow">', 1)

          page.write_text(s)

          admin = Path('app/admin/page.js')
          a = admin.read_text()
          if 'const MAX_BYTES = 800 * 1024;' not in a:
              pattern = r'function makePreview\(file\) \{.*\}\s*$'
              new_fn = '''function makePreview(file) {
            return new Promise((resolve, reject) => {
              const url = URL.createObjectURL(file);
              const img = new Image();
              img.onload = async () => {
                URL.revokeObjectURL(url);
                const MAX_BYTES = 800 * 1024;
                const TARGET_BYTES = 650 * 1024;
                let max = 1400;
                let quality = 0.84;
                let blob = null;
                try {
                  for (let attempt = 0; attempt < 12; attempt++) {
                    const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
                    canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
                    const ctx = canvas.getContext('2d', { alpha: false });
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', quality));
                    if (!blob) throw new Error('Could not create preview.');
                    if (blob.size <= TARGET_BYTES) break;
                    if (blob.size > MAX_BYTES) {
                      quality = Math.max(0.50, quality - 0.07);
                      if (quality <= 0.57) max = Math.max(900, Math.round(max * 0.88));
                    } else break;
                  }
                  resolve(blob);
                } catch (error) {
                  reject(error);
                }
              };
              img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read image.')); };
              img.src = url;
            });
          }'''
              a, count = re.subn(pattern, new_fn, a, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Expected one makePreview function, found {count}')
              admin.write_text(a)

          print('Patch complete')
          PY

      - name: Verify and commit
        run: |
          grep -q "₹5 single photo" app/page.js
          grep -q "₹20 group photo" app/page.js
          grep -q "DOWNLOAD FREE PREVIEW" app/page.js
          grep -q "MAX_BYTES = 800 \* 1024" app/admin/page.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js app/admin/page.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Set free preview downloads and new photo pricing"
          git push

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/update-photo-pricing.yml
          git commit -m "Remove temporary pricing patch workflow"
          git push
