name: Cleanup temporary Rekognition files
on:
  push:
    paths:
      - '.github/workflows/cleanup-rekognition-temp.yml'
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary files
        run: |
          rm -f tmp.txt tmp2.txt tmp3.txt tmp4.txt tmp5.txt tmp6.txt tmp7.txt tmp8.txt tmp9.txt tmp10.txt tmp11.txt tmp12.txt tmp13.txt tmp14.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Remove temporary files"
            git push
          fi
          git rm .github/workflows/cleanup-rekognition-temp.yml
          git commit -m "Remove cleanup workflow"
          git push
