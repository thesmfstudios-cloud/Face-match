name: Fix customer mobile photo picker

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[customer-picker-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove camera capture from upload picker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.js')
          s = p.read_text()
          old = 'accept="image/*" capture="user"'
          new = 'accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp"'
          if old not in s:
              raise SystemExit('Expected customer selfie input not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js
          git commit -m "Fix customer mobile photo picker [customer-picker-fixed]"
          git push origin HEAD:main

      - name: Remove one-time workflow
        shell: bash
        run: |
          git rm -f .github/workflows/fix-customer-upload-picker.yml || true
          git commit -m "Remove customer picker fix workflow [customer-picker-fixed]" || true
          git push origin HEAD:main || true
