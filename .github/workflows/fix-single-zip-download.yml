name: Fix single ZIP photo download

on:
  push:
    paths:
      - '.github/workflows/fix-single-zip-download.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch download flow
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          pkg = Path('package.json')
          data = json.loads(pkg.read_text(encoding='utf-8'))
          deps = data.setdefault('dependencies', {})
          deps['fflate'] = 'latest'
          pkg.write_text(json.dumps(data, separators=(',', ':')) + '\n', encoding='utf-8')

          page = Path('app/page.js')
          text = page.read_text(encoding='utf-8')

          start = text.find('  const downloadApprovedPhotos = async (approvedOrderId) => {')
          end = text.find('\n\n  const submitPayment = async () => {', start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate downloadApprovedPhotos block')

          new = '''  const downloadApprovedPhotos = async (approvedOrderId) => {\n    if (!approvedOrderId || !selected.length || downloadStarting || downloadStarted) return;\n    setDownloadStarting(true);\n    setMatchMessage('Payment verified. Preparing your original photos…');\n    try {\n      const response = await fetch(`/api/orders/${approvedOrderId}/download-zip`, {\n        method: 'GET',\n        cache: 'no-store',\n      });\n      if (!response.ok) {\n        let message = 'Could not prepare your photo download.';\n        try {\n          const body = await response.json();\n          message = body.error || message;\n        } catch {}\n        throw new Error(message);\n      }\n\n      const blob = await response.blob();\n      const url = URL.createObjectURL(blob);\n      const a = document.createElement('a');\n      a.href = url;\n      a.download = `SMF-Photos-${approvedOrderId.slice(0, 8)}.zip`;\n      document.body.appendChild(a);\n      a.click();\n      a.remove();\n      setTimeout(() => URL.revokeObjectURL(url), 10000);\n\n      setDownloadStarted(true);\n      setMatchMessage(`${selected.length} original photo${selected.length === 1 ? '' : 's'} downloaded as one ZIP.`);\n    } catch (error) {\n      setMatchMessage(error?.message || 'Could not start the photo download.');\n    } finally {\n      setDownloadStarting(false);\n    }\n  };'''
          text = text[:start] + new + text[end:]
          page.write_text(text, encoding='utf-8')
          PY

      - name: Add secure ZIP route
        run: |
          mkdir -p 'app/api/orders/[orderId]/download-zip'
          cat > 'app/api/orders/[orderId]/download-zip/route.js' <<'EOF'
          import { NextResponse } from 'next/server';
          import { createClient } from '@supabase/supabase-js';
          import { zipSync } from 'fflate';

          export const runtime = 'nodejs';

          const MAX_FILES = 100;
          const MAX_TOTAL_BYTES = 200 * 1024 * 1024;

          function safeFilename(name, fallback) {
            const clean = String(name || fallback)
              .replace(/[\\\\/:*?"<>|\r\n]+/g, '_')
              .replace(/^\.+/, '')
              .trim();
            return clean || fallback;
          }

          function uniqueName(name, used) {
            const dot = name.lastIndexOf('.');
            const base = dot > 0 ? name.slice(0, dot) : name;
            const ext = dot > 0 ? name.slice(dot) : '';
            let candidate = name;
            let n = 2;
            while (used.has(candidate.toLowerCase())) {
              candidate = `${base} (${n++})${ext}`;
            }
            used.add(candidate.toLowerCase());
            return candidate;
          }

          export async function GET(request, { params }) {
            try {
              const orderId = params?.orderId;
              if (!orderId) return NextResponse.json({ error: 'Missing order.' }, { status: 400 });

              const supabase = createClient(
                process.env.NEXT_PUBLIC_SUPABASE_URL,
                process.env.SUPABASE_SERVICE_ROLE_KEY,
                { auth: { persistSession: false } },
              );

              const { data: order, error: orderError } = await supabase
                .from('fm_orders')
                .select('id,status,selected_photo_ids')
                .eq('id', orderId)
                .single();

              if (orderError || !order) return NextResponse.json({ error: 'Order not found.' }, { status: 404 });
              if (!['approved', 'fulfilled'].includes(order.status)) {
                return NextResponse.json({ error: 'Payment is not approved yet.' }, { status: 403 });
              }

              const selectedIds = Array.isArray(order.selected_photo_ids) ? order.selected_photo_ids : [];
              if (!selectedIds.length) return NextResponse.json({ error: 'No photos were selected.' }, { status: 400 });
              if (selectedIds.length > MAX_FILES) return NextResponse.json({ error: 'Too many photos in one download.' }, { status: 400 });

              const { data: photos, error: photosError } = await supabase
                .from('fm_photos')
                .select('id,original_path,original_filename')
                .in('id', selectedIds);

              if (photosError) return NextResponse.json({ error: photosError.message }, { status: 500 });

              const byId = new Map((photos || []).map((photo) => [photo.id, photo]));
              const files = {};
              const usedNames = new Set();
              let totalBytes = 0;

              for (let index = 0; index < selectedIds.length; index++) {
                const photo = byId.get(selectedIds[index]);
                if (!photo?.original_path) return NextResponse.json({ error: 'A selected photo could not be found.' }, { status: 404 });

                const { data: file, error: downloadError } = await supabase.storage
                  .from('fm-originals')
                  .download(photo.original_path);
                if (downloadError || !file) {
                  return NextResponse.json({ error: downloadError?.message || 'Could not read original photo.' }, { status: 500 });
                }

                const bytes = new Uint8Array(await file.arrayBuffer());
                totalBytes += bytes.byteLength;
                if (totalBytes > MAX_TOTAL_BYTES) {
                  return NextResponse.json({ error: 'Selected originals are too large for one download. Please select fewer photos.' }, { status: 413 });
                }

                const fallback = `photo-${index + 1}.jpg`;
                const name = uniqueName(safeFilename(photo.original_filename, fallback), usedNames);
                files[name] = bytes;
              }

              const zip = zipSync(files, { level: 0 });
              const body = Buffer.from(zip);
              const filename = `SMF-Photos-${String(orderId).slice(0, 8)}.zip`;

              return new NextResponse(body, {
                status: 200,
                headers: {
                  'Content-Type': 'application/zip',
                  'Content-Length': String(body.byteLength),
                  'Content-Disposition': `attachment; filename="${filename}"`,
                  'Cache-Control': 'private, no-store, max-age=0',
                },
              });
            } catch (error) {
              return NextResponse.json({ error: error?.message || 'Could not prepare photo ZIP.' }, { status: 500 });
            }
          }
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json app/page.js 'app/api/orders/[orderId]/download-zip/route.js'
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m "Use one ZIP download for paid photos"
            git push
          fi

      - name: Remove one-time workflow
        run: |
          if git ls-files --error-unmatch .github/workflows/fix-single-zip-download.yml >/dev/null 2>&1; then
            git rm .github/workflows/fix-single-zip-download.yml
            git commit -m "Remove one-time ZIP download workflow"
            git push
          fi
