# Rekognition customer migration trigger
name: Switch customer matching to Amazon Rekognition

on:
  push:
    paths:
      - '.github/workflows/switch-customer-to-rekognition.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Switch customer matcher
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/page.js')
          text = path.read_text(encoding='utf-8')
          start = text.find('  const runFaceMatch = async () => {')
          end = text.find('\n\n  const toggle = (id) =>', start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate runFaceMatch block')

          new = '''  const runFaceMatch = async () => {
    if (!selfie || matching) return;
    await requestScanNotification();
    if (!photos.length) {
      setMatched(true);
      setMatchMessage('Demo mode is active. Supabase live photos will be matched after connection.');
      return;
    }

    setMatching(true);
    setMatched(false);
    setSelected([]);
    setMatchMessage('Finding your photos with AI…');

    try {
      const form = new FormData();
      form.append('eventSlug', EVENT_SLUG);
      form.append('selfie', selfie);

      const response = await fetch('/api/face-match', {
        method: 'POST',
        body: form,
        cache: 'no-store',
      });

      const body = await response.json().catch(() => ({}));
      if (!response.ok || !body.ok) {
        throw new Error(body.error || 'Face matching failed.');
      }

      const matchMap = new Map(
        (Array.isArray(body.matches) ? body.matches : []).map((match) => [String(match.photoId), Number(match.similarity || 0)])
      );

      const results = photos
        .filter((photo) => matchMap.has(String(photo.id)))
        .map((photo) => ({
          ...photo,
          match_similarity: matchMap.get(String(photo.id)),
          no_match: false,
        }));

      setMatched(true);
      setMatching(false);
      setMatchMessage(results.length
        ? `${results.length} matching photos found.`
        : 'No close face matches found. Try a clearer selfie or better lighting.');
      notifyScanComplete(results.length);

      const resultIds = new Set(results.map((r) => r.id));
      setPhotos((current) => current.map((photo) => (
        resultIds.has(photo.id)
          ? { ...photo, no_match: false, match_similarity: matchMap.get(String(photo.id)) }
          : { ...photo, no_match: true }
      )));
    } catch (error) {
      setMatching(false);
      setMatchMessage(error?.message || 'Face matching failed.');
    }
  };'''

          path.write_text(text[:start] + new + text[end:], encoding='utf-8')
          PY

      - name: Remove camera forcing from gallery upload
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/page.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace('accept="image/*" capture="user"', 'accept="image/*"')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js
          if ! git diff --cached --quiet; then
            git commit -m "Use Amazon Rekognition for customer face matching"
            git push
          fi
          git rm .github/workflows/switch-customer-to-rekognition.yml
          git commit -m "Remove one-time Rekognition migration workflow"
          git push
