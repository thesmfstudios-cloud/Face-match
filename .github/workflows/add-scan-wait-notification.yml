name: Add scan wait UX

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-scan-ux:
    if: "!contains(github.event.head_commit.message, '[scan-ux-auto]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch scan UX
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.js')
          s = p.read_text()

          old = "  const [downloadStarted, setDownloadStarted] = useState(false);\n"
          new = old + "  const [notificationPermission, setNotificationPermission] = useState('default');\n"
          if "notificationPermission" not in s:
              s = s.replace(old, new, 1)

          marker = "  const runFaceMatch = async () => {\n"
          helper = """  const requestScanNotification = async () => {\n    if (typeof window === 'undefined' || !('Notification' in window)) return;\n    try {\n      const permission = Notification.permission === 'default' ? await Notification.requestPermission() : Notification.permission;\n      setNotificationPermission(permission);\n    } catch {}\n  };\n\n  const notifyScanComplete = (count) => {\n    if (typeof window === 'undefined' || !('Notification' in window) || Notification.permission !== 'granted') return;\n    try {\n      new Notification('SMF Photo Match', {\n        body: count ? `${count} matching photos are ready to view.` : 'Your photo scan is complete. Tap to view your results.',\n        icon: '/favicon.ico',\n      });\n    } catch {}\n  };\n\n"""
          if "const requestScanNotification" not in s:
              s = s.replace(marker, helper + marker, 1)

          old = "  const runFaceMatch = async () => {\n    if (!selfie) return;\n"
          new = "  const runFaceMatch = async () => {\n    if (!selfie) return;\n    await requestScanNotification();\n"
          s = s.replace(old, new, 1)

          old = "    setMatching(true);\n    setMatchMessage('Loading face AI and scanning the event gallery…');\n"
          new = "    setMatching(true);\n    setMatchMessage('Scanning your photos… This can take up to 5–10 minutes. Please keep this page open.');\n"
          s = s.replace(old, new, 1)

          old = "      setMatched(true);\n      setMatching(false);\n      setMatchMessage(results.length ? `${results.length} matching photos found.` : 'No close face matches found. Try a clearer selfie or better lighting.');\n"
          new = "      setMatched(true);\n      setMatching(false);\n      setMatchMessage(results.length ? `${results.length} matching photos found.` : 'No close face matches found. Try a clearer selfie or better lighting.');\n      notifyScanComplete(results.length);\n"
          s = s.replace(old, new, 1)

          old = "      <section className=\"finderCard\"><div className=\"finderIcon\"><Camera size={28}/></div><div className=\"finderBody\"><div className=\"finderTitle\">Find my photos</div><div className=\"finderHint\">Use a front-facing selfie or camera capture with your face clearly visible.</div><input id=\"selfie\" hidden type=\"file\" accept=\"image/*\" capture=\"user\" onChange={chooseSelfie}/><div className=\"finderControls\"><label className=\"uploadButton\" htmlFor=\"selfie\">{selfie ? <><CheckCircle2 size={17}/> {selfieName}</> : <><Upload size={17}/> Upload photo</>}</label><button type=\"button\" className=\"cameraButton\" onClick={startCamera}><Video size={17}/> Use camera</button></div></div><button className=\"primaryButton\" disabled={!selfie || matching} onClick={runFaceMatch}>{matching ? <><Loader2 size={17} className=\"spin\"/> Matching…</> : <>Find photos <ArrowRight size={17}/></>}</button></section>\n"
          new = old + "      <div className=\"scanHelp\">⏳ Finding your photos can take up to 5–10 minutes. Please keep this page open.<br/><span>🔔 We’ll let you know as soon as your photos are ready.</span></div>\n"
          if "Finding your photos can take up to 5–10 minutes" not in s:
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Commit patched page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Add scan wait note and completion notification [scan-ux-auto]"
            git push
          fi
