name: Patch automatic original downloads

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch customer page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/page.js')
          s = p.read_text()

          state = "  const cameraStreamRef = useRef(null);\n"
          if "const [downloadStarting" not in s:
              s = s.replace(state, state + "  const [downloadStarting, setDownloadStarting] = useState(false);\n  const [downloadStarted, setDownloadStarted] = useState(false);\n", 1)

          helper = '''  const downloadApprovedPhotos = async (approvedOrderId) => {
    if (!approvedOrderId || !selected.length || downloadStarting || downloadStarted) return;
    setDownloadStarting(true);
    setMatchMessage('Payment verified. Starting your original downloads…');
    try {
      window.location.href = `/api/orders/${approvedOrderId}/download-zip`;
      setDownloadStarted(true);
      setMatchMessage(`${selected.length} original photo${selected.length === 1 ? '' : 's'} download started.`);
    } catch (error) {
      setMatchMessage(error?.message || 'Could not start the photo download.');
    } finally {
      setDownloadStarting(false);
    }
  };

'''

          pattern = r"  const downloadApprovedPhotos = async \(approvedOrderId\) => \{.*?\n  \};\n\n  const submitPayment = async \(\) => \{"
          if re.search(pattern, s, flags=re.S):
              s = re.sub(pattern, helper + "  const submitPayment = async () => {", s, count=1, flags=re.S)
          else:
              s = s.replace("  const submitPayment = async () => {\n", helper + "  const submitPayment = async () => {\n", 1)

          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js
          git diff --cached --quiet || git commit -m "fix: make paid photo download browser-native"
          git push
