name: Fix mobile admin photo picker

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[admin-picker-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch photo input
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/admin/page.js')
          s = p.read_text()
          old = '<input ref={inputRef} hidden type="file" multiple accept="image/jpeg,image/png,image/webp" onChange={(e) => setFiles(Array.from(e.target.files || []).slice(0, MAX_BATCH))}/>'
          new = '<input ref={inputRef} hidden type="file" multiple accept=".jpg,.jpeg,.png,.webp" onChange={(e) => { const picked = Array.from(e.target.files || []).filter((file) => /\\.(jpe?g|png|webp)$/i.test(file.name)); setFiles(picked.slice(0, MAX_BATCH)); }}/>'
          if old not in s:
              raise SystemExit('Expected photo input not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/page.js
          git commit -m "Fix mobile admin photo picker [admin-picker-fixed]"
          git push origin HEAD:main

      - name: Remove workflow
        shell: bash
        run: |
          git rm -f .github/workflows/fix-admin-photo-picker.yml || true
          git commit -m "Remove photo picker fix workflow [admin-picker-fixed]" || true
          git push origin HEAD:main || true
