name: Force standard Razorpay checkout flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[standard-razorpay-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Patch checkout options
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.js')
          s = p.read_text()
          old = "        key: createBody.key_id,\n        amount: createBody.amount, currency: createBody.currency,\n        name: 'SMF Studios',"
          new = "        key: createBody.key_id,\n        one_click_checkout: false,\n        amount: createBody.amount, currency: createBody.currency,\n        name: 'SMF Studios',"
          if old not in s:
              raise SystemExit('checkout options marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js
          git commit -m "Force Standard Razorpay checkout [standard-razorpay-done]"
          git push origin main
      - name: Remove workflow
        shell: bash
        run: |
          git rm -f .github/workflows/force-standard-razorpay-checkout.yml || true
          git commit -m "Remove standard checkout patch workflow [standard-razorpay-cleanup]" || true
          git push origin main || true
