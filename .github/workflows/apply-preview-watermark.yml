name: Apply customer preview cache bust

on:
  push:
    paths:
      - '.github/workflows/apply-preview-watermark.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch customer preview URL
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/page.js')
          text = p.read_text()
          old = "preview_url: supabase.storage.from('fm-previews').getPublicUrl(row.preview_path).data.publicUrl,"
          new = "preview_url: `${supabase.storage.from('fm-previews').getPublicUrl(row.preview_path).data.publicUrl}?v=${Date.now()}`,"
          if old in text:
              text = text.replace(old, new, 1)
          elif "?v=${Date.now()}" not in text:
              raise SystemExit('customer preview URL line not found')
          p.write_text(text)
          PY
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: bust cached customer preview URLs'
          git push
