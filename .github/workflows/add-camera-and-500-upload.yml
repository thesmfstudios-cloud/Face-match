name: Add camera scan and 500 photo admin upload

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch customer camera flow and admin batch size
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page = Path('app/page.js')
          s = page.read_text()

          # Imports
          old = "import { ArrowRight, Camera, Check, CheckCircle2, ImagePlus, IndianRupee, Lock, Search, ShieldCheck, Sparkles, Upload, X, Loader2, RefreshCw, ExternalLink } from 'lucide-react';"
          new = "import { ArrowRight, Camera, Video, Check, CheckCircle2, ImagePlus, IndianRupee, Lock, Search, ShieldCheck, Sparkles, Upload, X, Loader2, RefreshCw, ExternalLink } from 'lucide-react';"
          if old not in s:
              raise SystemExit('page import line not found')
          s = s.replace(old, new, 1)

          # Camera state
          old = "  const [dataError, setDataError] = useState('');\n"
          new = "  const [dataError, setDataError] = useState('');\n  const [cameraOpen, setCameraOpen] = useState(false);\n  const videoRef = useRef(null);\n  const cameraStreamRef = useRef(null);\n"
          if old not in s:
              raise SystemExit('page state anchor not found')
          s = s.replace(old, new, 1)

          # Camera helpers before chooseSelfie
          anchor = "  const chooseSelfie = (e) => {\n"
          camera_code = r'''  const stopCamera = () => {
    const stream = cameraStreamRef.current;
    if (stream) stream.getTracks().forEach((track) => track.stop());
    cameraStreamRef.current = null;
    if (videoRef.current) videoRef.current.srcObject = null;
    setCameraOpen(false);
  };

  const startCamera = async () => {
    setMatchMessage('');
    try {
      if (!navigator.mediaDevices?.getUserMedia) throw new Error('Camera access is not supported in this browser.');
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
      cameraStreamRef.current = stream;
      setCameraOpen(true);
      requestAnimationFrame(() => {
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          videoRef.current.play().catch(() => {});
        }
      });
    } catch (error) {
      setMatchMessage(error?.message || 'Could not open camera. Please allow camera permission.');
    }
  };

  const captureCameraSelfie = () => {
    const video = videoRef.current;
    if (!video || !video.videoWidth) return;
    const canvas = document.createElement('canvas');
    const max = 1280;
    const scale = Math.min(1, max / Math.max(video.videoWidth, video.videoHeight));
    canvas.width = Math.max(1, Math.round(video.videoWidth * scale));
    canvas.height = Math.max(1, Math.round(video.videoHeight * scale));
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    canvas.toBlob((blob) => {
      if (!blob) return;
      const file = new File([blob], `camera-selfie-${Date.now()}.jpg`, { type: 'image/jpeg' });
      setSelfie(file);
      setSelfieName('Camera selfie');
      setMatched(false);
      setMatchMessage('');
      setSelected([]);
      stopCamera();
    }, 'image/jpeg', 0.9);
  };

'''
          if anchor not in s:
              raise SystemExit('chooseSelfie anchor not found')
          s = s.replace(anchor, camera_code + anchor, 1)

          # Finder controls
          old = "<label className=\"uploadButton\" htmlFor=\"selfie\">{selfie ? <><CheckCircle2 size={17}/> {selfieName}</> : <><Upload size={17}/> Choose selfie</>}</label></div><button className=\"primaryButton\" disabled={!selfie || matching} onClick={runFaceMatch}>"
          new = "<div className=\"finderControls\"><label className=\"uploadButton\" htmlFor=\"selfie\">{selfie ? <><CheckCircle2 size={17}/> {selfieName}</> : <><Upload size={17}/> Upload photo</>}</label><button type=\"button\" className=\"cameraButton\" onClick={startCamera}><Video size={17}/> Use camera</button></div></div><button className=\"primaryButton\" disabled={!selfie || matching} onClick={runFaceMatch}>"
          if old not in s:
              raise SystemExit('finder control anchor not found')
          s = s.replace(old, new, 1)

          # Camera modal before PaymentModal
          anchor = "    {paymentOpen && <PaymentModal amount={total} utr={utr} setUtr={setUtr} onClose={() => setPaymentOpen(false)} onSubmit={submitPayment}/>}<footer className=\"footer\">"
          new = "    {cameraOpen && <CameraModal videoRef={videoRef} onCapture={captureCameraSelfie} onClose={stopCamera}/>}\n    {paymentOpen && <PaymentModal amount={total} utr={utr} setUtr={setUtr} onClose={() => setPaymentOpen(false)} onSubmit={submitPayment}/>}<footer className=\"footer\">"
          if anchor not in s:
              raise SystemExit('modal insertion anchor not found')
          s = s.replace(anchor, new, 1)

          # Camera modal component before PaymentModal
          anchor = "function PaymentModal({ amount, utr, setUtr, onClose, onSubmit }) {\n"
          camera_component = r'''function CameraModal({ videoRef, onCapture, onClose }) {
  return <div className="cameraBackdrop"><div className="cameraModal"><div className="cameraHeader"><div><div className="modalEyebrow"><Video size={14}/> CAMERA SCAN</div><h2>Take a clear selfie</h2><p>Keep your face centered and look at the camera.</p></div><button className="closeButton" onClick={onClose}><X size={19}/></button></div><div className="cameraViewport"><video ref={videoRef} autoPlay playsInline muted/></div><button className="captureButton" onClick={onCapture}><Camera size={19}/> Capture selfie</button></div></div>;
}

'''
          if anchor not in s:
              raise SystemExit('PaymentModal anchor not found')
          s = s.replace(anchor, camera_component + anchor, 1)

          page.write_text(s)

          admin = Path('app/admin/page.js')
          a = admin.read_text()
          if "const MAX_BATCH = 20;" not in a:
              raise SystemExit('MAX_BATCH not found')
          a = a.replace("const MAX_BATCH = 20;", "const MAX_BATCH = 500;\nconst REQUEST_CHUNK = 25;", 1)

          # Replace upload function with chunked signed-url preparation while keeping one 500-file selection.
          pattern = r"  const upload = async \(\) => \{.*?\n  \};\n\n  return <main"
          m = re.search(pattern, a, flags=re.S)
          if not m:
              raise SystemExit('admin upload function not found')
          upload_fn = r'''  const upload = async () => {
    if (!code || !files.length || busy) return;
    setBusy(true);
    const selected = files.slice(0, MAX_BATCH);
    const uploaded = [];
    try {
      for (let offset = 0; offset < selected.length; offset += REQUEST_CHUNK) {
        const chunk = selected.slice(offset, offset + REQUEST_CHUNK);
        setStatus(`Preparing photos ${offset + 1}-${Math.min(offset + REQUEST_CHUNK, selected.length)} of ${selected.length}…`);
        const urlRes = await fetch('/api/admin/upload-url', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-admin-code': code },
          body: JSON.stringify({ eventSlug: EVENT_SLUG, files: chunk.map((f) => ({ name: f.name, type: f.type, size: f.size })) }),
        });
        const urlText = await urlRes.text();
        let urlBody;
        try { urlBody = JSON.parse(urlText); } catch { throw new Error(urlText.slice(0, 180) || `Server error (${urlRes.status})`); }
        if (!urlRes.ok) throw new Error(urlBody.error || 'Could not prepare upload.');

        const supabase = getSupabaseBrowser();
        for (let i = 0; i < chunk.length; i++) {
          const file = chunk[i];
          const u = urlBody.uploads[i];
          const overallIndex = offset + i + 1;
          setStatus(`Uploading ${overallIndex}/${selected.length}: ${file.name}`);
          const original = await supabase.storage.from('fm-originals').uploadToSignedUrl(u.originalPath, u.originalToken, file, { contentType: file.type || 'image/jpeg' });
          if (original.error) throw original.error;
          const previewFile = await makePreview(file);
          const preview = await supabase.storage.from('fm-previews').uploadToSignedUrl(u.previewPath, u.previewToken, previewFile, { contentType: 'image/jpeg' });
          if (preview.error) throw preview.error;
          uploaded.push({ name: u.name, originalPath: u.originalPath, previewPath: u.previewPath });
        }
      }

      setStatus(`Finalizing ${uploaded.length} photos…`);
      const finalRes = await fetch('/api/admin/upload-finalize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-code': code },
        body: JSON.stringify({ eventSlug: EVENT_SLUG, uploads: uploaded }),
      });
      const finalText = await finalRes.text();
      let finalBody;
      try { finalBody = JSON.parse(finalText); } catch { throw new Error(finalText.slice(0, 180) || `Finalize error (${finalRes.status})`); }
      if (!finalRes.ok) throw new Error(finalBody.error || 'Could not finalize upload.');
      setStatus(`✓ ${finalBody.count} photos uploaded successfully.`);
      setFiles([]);
      if (inputRef.current) inputRef.current.value = '';
    } catch (error) {
      setStatus(`Upload failed: ${error?.message || 'Unknown error'}`);
    } finally {
      setBusy(false);
    }
  };

  return <main'''
          a = a[:m.start()] + upload_fn + a[m.end():]

          a = a.replace('Select up to 20 photos per batch', 'Select up to 500 photos per batch', 1)
          a = a.replace('Select up to 20 photos per batch', 'Select up to 500 photos per batch', 1)
          a = a.replace("<div style={{ marginTop: 12, color: '#aaa', fontSize: 12 }}>{files.length ? `${files.length} files selected` : 'Select up to 20 photos per batch'}</div>", "<div style={{ marginTop: 12, color: '#aaa', fontSize: 12 }}>{files.length ? `${files.length} files selected` : 'Select up to 500 photos per batch'}</div>", 1)
          a = a.replace("Upload {Math.min(files.length, MAX_BATCH)} photos", "Upload {Math.min(files.length, MAX_BATCH)} photos", 1)
          admin.write_text(a)

          # CSS additions for camera button/modal and cleaner controls.
          css = Path('app/globals.css')
          c = css.read_text()
          additions = r'''
.finderControls{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.cameraButton{display:inline-flex;align-items:center;gap:8px;border:1px solid #454545;background:#161616;color:#f4f1ea;padding:11px 14px;border-radius:9px;font-size:11px;font-weight:700;cursor:pointer}.cameraButton:hover{border-color:#777}.cameraBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.82);display:grid;place-items:center;padding:20px;z-index:60}.cameraModal{width:min(620px,100%);background:#111;color:#f4f1ea;border:1px solid #383838;border-radius:14px;padding:22px;box-shadow:0 30px 100px rgba(0,0,0,.72)}.cameraHeader{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.cameraHeader h2{font-family:'Playfair Display',Georgia,serif;font-size:32px;letter-spacing:-.04em;margin:8px 0 5px}.cameraHeader p{margin:0;color:#888;font-size:11px}.cameraViewport{margin:18px 0 14px;border:1px solid #333;background:#050505;aspect-ratio:4/3;overflow:hidden;border-radius:8px}.cameraViewport video{width:100%;height:100%;display:block;object-fit:cover;transform:scaleX(-1)}.captureButton{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#eeeae2;color:#111;border:0;border-radius:4px;padding:13px 16px;font-size:11px;font-weight:800;cursor:pointer}.captureButton:hover{background:#fff}
@media(max-width:620px){.finderControls{width:100%}.finderControls .uploadButton,.finderControls .cameraButton{flex:1;justify-content:center}.cameraModal{padding:16px}.cameraHeader h2{font-size:27px}}
'''
          if '.cameraBackdrop{' not in c:
              c = c.rstrip() + '\n' + additions
          css.write_text(c)
          PY

      - name: Verify changes
        run: |
          grep -q "const MAX_BATCH = 500" app/admin/page.js
          grep -q "startCamera" app/page.js
          grep -q "cameraBackdrop" app/globals.css
          grep -q "const REQUEST_CHUNK = 25" app/admin/page.js

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js app/admin/page.js app/globals.css .github/workflows/add-camera-and-500-upload.yml
          git commit -m "Add camera selfie scan and 500 photo upload"
          git rm .github/workflows/add-camera-and-500-upload.yml
          git commit -m "Remove temporary patch workflow"
          git push
