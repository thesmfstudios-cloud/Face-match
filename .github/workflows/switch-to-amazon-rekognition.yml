name: Switch face matching to Amazon Rekognition

on:
  push:
    paths:
      - '.github/workflows/switch-to-amazon-rekognition.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Replace browser matcher with Rekognition API
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/page.js')
          text = path.read_text(encoding='utf-8')
          start = text.find('  const runFaceMatch = async () => {')
          end = text.find('\n\n  const toggle = ', start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate runFaceMatch block')
          new = '''  const runFaceMatch = async () => {
    if (!selfie || matching) return;
    await requestScanNotification();
    if (!photos.length) {
      setMatched(true);
      setMatchMessage('No event photos are available yet.');
      return;
    }

    setMatching(true);
    setSelected([]);
    setMatchMessage('Finding your photos with AI…');
    try {
      const form = new FormData();
      form.append('eventSlug', EVENT_SLUG);
      form.append('selfie', selfie);

      const response = await fetch('/api/face-match', {
        method: 'POST',
        body: form,
        cache: 'no-store',
      });
      const body = await response.json();
      if (!response.ok || !body.ok) throw new Error(body.error || 'Face matching failed.');

      const matchMap = new Map((body.matches || []).map((m) => [m.photoId, Number(m.similarity || 0)]));
      const results = photos
        .filter((photo) => matchMap.has(photo.id))
        .map((photo) => ({
          ...photo,
          match_similarity: matchMap.get(photo.id),
          match_distance: Math.max(0, 1 - (matchMap.get(photo.id) || 0) / 100),
          people_count: Math.max(Number(photo.people_count || 1), 1),
          price: Number(photo.people_count || 1) > 1 ? 15 : 5,
          no_match: false,
        }))
        .sort((a, b) => (b.match_similarity || 0) - (a.match_similarity || 0));

      setPhotos((current) => {
        const byId = new Map(results.map((r) => [r.id, r]));
        return current.map((photo) => byId.get(photo.id) || { ...photo, no_match: true });
      });
      setMatched(true);
      setMatchMessage(results.length ? `${results.length} matching photos found.` : 'No close face matches found. Try a clearer selfie or better lighting.');
      notifyScanComplete(results.length);
    } catch (err) {
      setMatchMessage(err?.message || 'Face matching failed.');
    } finally {
      setMatching(false);
    }
  };'''
          path.write_text(text[:start] + new + text[end:], encoding='utf-8')
          PY

      - name: Add recurring admin Rekognition index control
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/admin/page.js')
          text = path.read_text(encoding='utf-8')
          marker = "  const [message, setMessage] = useState('');"
          if marker not in text:
              print('Admin state marker not found; skipping UI injection.')
              raise SystemExit(0)
          insert = marker + "\n  const [rekognitionProgress, setRekognitionProgress] = useState('');"
          if 'rekognitionProgress' not in text:
              text = text.replace(marker, insert, 1)
          fn_marker = "  const handleUpload = async () => {"
          if fn_marker in text and 'buildRekognitionIndex' not in text:
              fn = '''  const buildRekognitionIndex = async () => {
    const code = window.prompt('Enter admin access code to build AI face index:');
    if (!code) return;
    let offset = 0;
    let total = 0;
    setRekognitionProgress('Starting AI face index…');
    try {
      while (true) {
        const response = await fetch('/api/admin/rekognition-index', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-admin-code': code },
          body: JSON.stringify({ eventSlug: 'sam-college-2026', offset, limit: 25 }),
        });
        const body = await response.json();
        if (!response.ok || !body.ok) throw new Error(body.error || 'Could not build AI index.');
        offset = body.nextOffset;
        total = body.totalReady;
        setRekognitionProgress(`AI index: ${Math.min(offset, total)}/${total} photos processed.`);
        if (body.done) break;
      }
      setRekognitionProgress(`AI face index ready: ${total} photos processed.`);
    } catch (error) {
      setRekognitionProgress(error?.message || 'AI index failed.');
    }
  };\n\n'''
              text = text.replace(fn_marker, fn + fn_marker, 1)
          needle = 'Delete all event photos'
          if needle in text and 'Build AI face index' not in text:
              pos = text.find(needle)
              line_start = text.rfind('\n', 0, pos) + 1
              text = text[:line_start] + "          <button type=\"button\" onClick={buildRekognitionIndex}>Build AI face index</button>\n          {rekognitionProgress ? <div>{rekognitionProgress}</div> : null}\n" + text[line_start:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js app/admin/page.js package.json lib/aws-rekognition.js app/api/face-match/route.js app/api/admin/rekognition-index/route.js
          git commit -m "Use Amazon Rekognition for face matching and indexing"
          git push
          git rm .github/workflows/switch-to-amazon-rekognition.yml || true
          git commit -m "Remove one-time Rekognition migration workflow" || true
          git push || true
