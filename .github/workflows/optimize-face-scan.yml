name: Optimize face scan performance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize-scan:
    if: "!contains(github.event.head_commit.message, '[face-scan-optimized]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch scan loop
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/page.js')
          s = p.read_text()

          if 'const SCAN_BATCH_SIZE = 4;' not in s:
              s = s.replace(
                  "const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';\n",
                  "const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';\nconst SCAN_BATCH_SIZE = 4;\n",
                  1,
              )

          old = '''      const results = [];
      for (const photo of photos) {
        try {
          const img = await loadImage(photo.preview_url, true);
          const faces = await faceapi.detectAllFaces(img, new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.45 }))
            .withFaceLandmarks().withFaceDescriptors();
          const distances = faces.map((f) => faceapi.euclideanDistance(probe.descriptor, f.descriptor));
          const best = distances.length ? Math.min(...distances) : 9;
          if (best < 0.53) results.push({ ...photo, match_distance: best, people_count: Math.max(Number(photo.people_count || 1), faces.length), price: Math.max(Number(photo.people_count || 1), faces.length) > 1 ? 15 : 5 });
        } catch (err) {
          console.warn('Could not scan photo', photo.id, err);
        }
      }
'''

          new = '''      const results = [];
      let scannedCount = 0;
      const scanPhoto = async (photo) => {
        try {
          const img = await loadImage(photo.preview_url, true);
          const faces = await faceapi.detectAllFaces(img, new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.45 }))
            .withFaceLandmarks().withFaceDescriptors();
          const distances = faces.map((f) => faceapi.euclideanDistance(probe.descriptor, f.descriptor));
          const best = distances.length ? Math.min(...distances) : 9;
          if (best < 0.53) return { ...photo, match_distance: best, people_count: Math.max(Number(photo.people_count || 1), faces.length), price: Math.max(Number(photo.people_count || 1), faces.length) > 1 ? 15 : 5 };
        } catch (err) {
          console.warn('Could not scan photo', photo.id, err);
        }
        return null;
      };

      for (let offset = 0; offset < photos.length; offset += SCAN_BATCH_SIZE) {
        const batch = photos.slice(offset, offset + SCAN_BATCH_SIZE);
        setMatchMessage(`Scanning your photos… ${Math.min(offset + batch.length, photos.length)}/${photos.length} scanned. This can take up to 5–10 minutes. Please keep this page open.`);
        const batchResults = await Promise.all(batch.map(scanPhoto));
        for (const result of batchResults) if (result) results.push(result);
        scannedCount += batch.length;
      }
'''

          if old not in s:
              raise SystemExit('Expected scan loop was not found; aborting without changes.')
          s = s.replace(old, new, 1)

          # Add a visible scan-stage message before heavy work so the state is immediate.
          s = s.replace(
              "    setMatching(true);\n    setMatchMessage('Scanning your photos… This can take up to 5–10 minutes. Please keep this page open.');\n",
              "    setMatching(true);\n    setMatchMessage(`Scanning your photos… 0/${photos.length} scanned. This can take up to 5–10 minutes. Please keep this page open.`);\n",
              1,
          )

          p.write_text(s)
          PY

      - name: Commit optimized scan
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js
          if git diff --cached --quiet; then
            echo "No scan changes needed."
          else
            git commit -m "Optimize face scan batches [face-scan-optimized]"
            git push
          fi

      - name: Remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/optimize-face-scan.yml
          git commit -m "Remove one-time scan optimization workflow [face-scan-optimized]" || true
          git push || true
